# pre-commit hooks (spec §12.8). Install once: `uvx pre-commit install`
# Run on everything: `uvx pre-commit run --all-files` (or `make precommit`).
# Remote hook revisions are pinned by commit SHA; Dependabot (pre-commit) proposes bumps.
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(ps1|bat|cmd)$
      - id: fix-byte-order-marker
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd # frozen: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(backend|ml|scripts)/
      - id: ruff-format
        files: ^(backend|ml|scripts)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (backend)
        entry: python scripts/uv_backend.py run --frozen mypy
        language: python
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: uv-lock-check
        name: uv lock --check (backend)
        entry: python scripts/uv_backend.py lock --check
        language: python
        files: ^backend/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: uv-lock-check-ml
        name: uv lock --check (ml)
        entry: uv lock --check --directory ml
        language: system
        files: ^ml/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: frontend-eslint
        name: eslint (frontend)
        entry: corepack pnpm --dir frontend lint
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|mjs|mts)$
        pass_filenames: false
      - id: frontend-prettier
        name: prettier --check (frontend)
        entry: corepack pnpm --dir frontend format:check
        language: system
        files: ^frontend/
        pass_filenames: false
