# E4 SFT of Qwen3.5-2B: LoRA on an fp16 base (spec v1.1 §9.5 table, A-03; ERPROT
# qlora-training-on-t4 "Decision" §2). Validated by tw_ml.train.config; config_sha is the SHA-256
# of the validated canonical JSON (comments and formatting do not change it).
#
#   python -m tw_ml.train --config ml/configs/sft_qwen35_2b.yaml --seed 42 [--dry-run]
#   python -m tw_ml.train.smoke --config ml/configs/sft_qwen35_2b.yaml --steps 20   (R-21)
#
# <verify> pins are refused unless --allow-unverified; use the commit SHA pinned for this base in
# ml/configs/bakeoff.yaml. <hf_user> must be your HF user name before any run that pushes.
kind: sft
version: sft.v1
name: sft-qwen35-2b
base:
  repo: Qwen/Qwen3.5-2B
  revision: 15852e8c16360a2fea060d615a32b45270f8a8fc # main on 2026-09-28 (HF API); license re-checked
  license: apache-2.0
  params_b: 2.0
model_class: Qwen3_5ForCausalLM # text-only class (the checkpoint is vision-language)
method: lora_fp16 # <= 2B: LoRA on an fp16 base; Unsloth advises against QLoRA for Qwen3.5
trust_remote_code: false
use_safetensors: true
precision:
  fp16: true # T4 has no bf16 hardware; TRL enables bf16 unless fp16 is set
  bf16: false
  attn_implementation: sdpa # no FlashAttention-2 on Turing
quantization: null
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  # PEFT's all-linear excludes lm_head and covers q/k/v/o/gate/up/down plus the Gated DeltaNet
  # projections (in_proj_qkv, in_proj_z, in_proj_b, in_proj_a, out_proj) of 18 of 24 layers.
  target_modules: all-linear
train:
  max_length: 2048 # TRL's default 1024 truncates keep_start (loses the completion)
  epochs: 3
  per_device_batch: 4
  grad_accum: 8 # effective 32: ~113 optimizer steps per epoch, ~338 in total
  per_device_eval_batch: 8
  lr: 2.0e-4 # TRL's default is 2e-5
  scheduler: cosine
  warmup_ratio: 0.03 # passed as warmup_steps (a float ratio in TrainingArguments v5)
  optim: adamw_torch
  gradient_checkpointing: true
  packing: false # packing and padding-free need FlashAttention (not on T4)
  padding_free: false
  loss_type: chunked_nll # verified by the smoke test; the fallback keeps the effective batch
  loss_fallback:
    loss_type: nll
    per_device_batch: 2
    grad_accum: 16
  eval_steps: 25 # ~0.22 epoch; the §9.5 cadence
  save_steps: 25
  save_total_limit: 3
  logging_steps: 5
  early_stopping_patience: 4 # evaluations of eval_loss
  metric_for_best_model: eval_loss
  max_over_length_fraction: 0.01 # engineering guard, not a spec value: more rejected rows fail
  generation_eval: # epoch-end greedy val macro-F1 picks the final checkpoint (ties: lower loss)
    max_new_tokens: 512
    batch_size: 16
seeds: [42, 1337, 2026]
hub:
  checkpoint_repo: <hf_user>/tw-triage-qwen35-2b-lora-s{seed}-ckpt
  private: true # public only after the sanitization review (§9.5)
  strategy: checkpoint # every save, plus last-checkpoint/ for resume
tracking:
  experiment: tw-triage-sft
  store: file # a local MLflow file store in the run folder, synced to the checkpoint repo
  report_to: [mlflow, codecarbon]
platform:
  hardware: t4
  torch: "2.11" # the platform's torch (Kaggle and Colab), asserted at runtime, never locked
smoke:
  rows: 8
  max_peak_memory_gib: 13.0
  max_hours_per_seed: 2.0
  resume_tolerance: 1.0e-3
data:
  train_file: train/records.jsonl # under --data-dir (default data/generated)
  val_file: val/records.jsonl
  prompt_version: triage.v1
  prompt_format: ml/configs/prompt_formats/qwen35-2b.json # parity reference (bake-off step 4)
