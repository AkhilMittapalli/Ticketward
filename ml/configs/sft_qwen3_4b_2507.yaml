# E4 SFT of Qwen3-4B-Instruct-2507: QLoRA (4-bit NF4 + double quant, fp16 compute) for the 3-4B
# class (spec v1.1 §9.5 table, A-03; ERPROT qlora-training-on-t4 "Decision" §1-§3). Only trained
# if the bake-off's >= 3-point rule selects it (ADR-0011). Validated by tw_ml.train.config.
#
#   python -m tw_ml.train --config ml/configs/sft_qwen3_4b_2507.yaml --seed 42 [--dry-run]
#   python -m tw_ml.train.smoke --config ml/configs/sft_qwen3_4b_2507.yaml --steps 20   (R-21)
#
# After trainer init the trainable adapter weights are re-cast to fp32 (TRL >= 0.26 casts the
# adapters of quantized models to bf16, which is unsafe on T4); the smoke test asserts it.
kind: sft
version: sft.v1
name: sft-qwen3-4b-2507
base:
  repo: Qwen/Qwen3-4B-Instruct-2507
  revision: <verify> # bakeoff.yaml candidate qwen3-4b-2507 hf_revision
  license: apache-2.0
  params_b: 4.0
model_class: AutoModelForCausalLM # pure-text transformer, non-thinking only
method: qlora_nf4 # 3-4B: QLoRA
trust_remote_code: false
use_safetensors: true
precision:
  fp16: true # T4 has no bf16 hardware; TRL enables bf16 unless fp16 is set
  bf16: false
  attn_implementation: sdpa # no FlashAttention-2 on Turing
quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: float16
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: all-linear # q/k/v/o/gate/up/down; PEFT excludes lm_head
train:
  max_length: 2048 # TRL's default 1024 truncates keep_start (loses the completion)
  epochs: 3
  per_device_batch: 4
  grad_accum: 8 # effective 32: ~113 optimizer steps per epoch, ~338 in total
  per_device_eval_batch: 8
  lr: 2.0e-4 # TRL's default is 2e-5
  scheduler: cosine
  warmup_ratio: 0.03 # passed as warmup_steps (a float ratio in TrainingArguments v5)
  optim: paged_adamw_8bit # QLoRA
  gradient_checkpointing: true
  packing: false # packing and padding-free need FlashAttention (not on T4)
  padding_free: false
  loss_type: chunked_nll # on the nll path 4B-class logits exceed 15 GiB at batch 4 (estimate)
  loss_fallback:
    loss_type: nll
    per_device_batch: 2
    grad_accum: 16
  eval_steps: 25
  save_steps: 25
  save_total_limit: 3
  logging_steps: 5
  early_stopping_patience: 4
  metric_for_best_model: eval_loss
  max_over_length_fraction: 0.01 # engineering guard, not a spec value: more rejected rows fail
  generation_eval:
    max_new_tokens: 512
    batch_size: 16
seeds: [42, 1337, 2026]
hub:
  checkpoint_repo: <hf_user>/tw-triage-qwen3-4b-2507-qlora-s{seed}-ckpt
  private: true
  strategy: checkpoint
tracking:
  experiment: tw-triage-sft
  store: file
  report_to: [mlflow, codecarbon]
platform:
  hardware: t4
  torch: "2.11"
smoke:
  rows: 8
  max_peak_memory_gib: 13.0
  max_hours_per_seed: 4.0 # 4B-class budget (§9.5)
  resume_tolerance: 1.0e-3
data:
  train_file: train/records.jsonl
  val_file: val/records.jsonl
  prompt_version: triage.v1
  prompt_format: ml/configs/prompt_formats/qwen3-4b-2507.json
