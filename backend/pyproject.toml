[project]
name = "ticketward"
version = "0.1.0.dev0"
description = "Ticketward backend: evidence-first, human-in-the-loop CX resolution copilot (FastAPI)."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Akhil Mittapalli" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.31",
    "fastapi>=0.141",
    "pydantic[email]>=2.13",
    "pydantic-settings>=2.15",
    "redis>=8.1",
    "sqlalchemy[asyncio]>=2.1",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54",
]

[project.scripts]
tw-export-contracts = "ticketward.tools.export_contracts:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.168",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.9.6,<0.10"]
build-backend = "uv_build"

[tool.uv]
# R-13: never create the virtualenv inside this OneDrive-synced repo. Set
# UV_PROJECT_ENVIRONMENT to a directory outside OneDrive (see README "Local setup").
required-version = ">=0.9.6"
default-groups = ["dev"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["alembic/versions/__init__.py"]

[tool.ruff.lint]
# Spec §14.2 rule set, plus D (Google docstrings) to enforce the docstring standard.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "ASYNC", "PL", "RUF", "TID", "PT", "DTZ", "N", "ANN", "D"]
ignore = [
    "D105", # magic methods are self-describing
    "D107", # __init__ is documented in the class docstring (Google style)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8 # the spec's LLMProvider.generate_structured port takes 6 keyword arguments

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["ticketward"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",       # test names document intent
    "ANN401",  # payload-builder helpers take **overrides: Any
    "S101",    # assert is the pytest idiom
    "S105",    # fake credentials are expected in tests
    "S106",
    "PLR2004", # literal expectations are clearer inline
]
"alembic/**/*.py" = ["D"]
"alembic/versions/*.py" = ["N999"] # revision files start with their sequence number

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "alembic", "../scripts"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = [
    "error",
    # Starlette 1.7 prefers the newer `httpx2` for TestClient; we stay on `httpx` until
    # that package is reviewed (see CONTRIBUTING.md "Dependency notes").
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "unit: fast, isolated tests with no external services (auto-applied under tests/unit)",
    "integration: requires real Postgres/Redis (testcontainers from P4)",
    "security: security regression suite (auto-applied under tests/security)",
    "property: hypothesis property-based tests (auto-applied under tests/property)",
    "contract: schema/API contract tests (auto-applied under tests/contract)",
]

# --------------------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["ticketward"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(typing\\.)?overload",
    "class .*\\(.*Protocol.*\\):",
]

# --------------------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests"]
