# Alembic configuration (spec §10 "Migrations").
# The database URL is NOT configured here: env.py builds it from TW_* settings and
# secret files, so no credentials ever live in this file. Logging goes through the
# application's structlog configuration (see alembic/env.py).

[alembic]
script_location = %(here)s/alembic
# Sequential, zero-padded revision ids: alembic revision --rev-id 0002 -m "add tickets"
file_template = %%(rev)s_%%(slug)s
path_separator = os
