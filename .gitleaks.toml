# gitleaks configuration: every default rule stays active.
# Allow-list entries are limited to deliberately fake, secret-shaped test values and to public,
# non-secret identifiers that the generic-api-key heuristic mistakes for secrets. Keep every
# entry exact and explained; never allow-list a directory.

title = "Ticketward gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Fake test credentials and public identifiers (see comments)"
paths = [
  # Tests whose purpose is to contain fake secret-shaped strings: they prove the log redactor
  # (core/logging.py) and the research privacy scanner (tools/publish_research.py) catch them.
  '''^backend/tests/unit/test_logging\.py$''',
  '''^backend/tests/unit/test_publish_research\.py$''',
  # Fake secret and PII fixtures that prove the datagen PII masker catches them.
  '''^ml/tests/test_pii_noise_entities\.py$''',
]
regexes = [
  # Fake "strong" secrets that satisfy the prod settings validator in unit/security tests
  # (backend/tests/unit/test_config.py, backend/tests/security/test_route_auth.py).
  '''^Zq8vN2kLr5TtY7wPx3Hm$''',
  '''^a9F3kQ7mZ2xW8vB4nR6t$''',
  # Fake credential text used to prove problem+json never echoes exception text.
  '''hunter2''',
  # Public GitHub security-advisory identifiers cited in research notes.
  '''^GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}$''',
  # Hugging Face transformers model class names (e.g. Qwen3_5ForCausalLM).
  '''^[A-Za-z0-9_]+For(?:CausalLM|SequenceClassification|TokenClassification)$''',
  # Fake provider API key used to prove keys never reach logs or errors (ml/tests/test_providers.py).
  '''^sk-test-DO-NOT-LEAK-''',
  # Public Mistral API model ids (configs and tests), e.g. mistral-large-3-25-12.
  '''^mistral-[a-z0-9-]+$''',
]
