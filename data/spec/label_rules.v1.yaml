# Label rules used by the P1 data tools (tw_ml.datagen: prompts, P-B gold labels, validate.py).
#
# Source: spec v1.1 §5.1 (critical / forced-review columns), §5.3 (priority), §5.5 (churn, A-06),
# §5.8 (routing), §9.2 and docs/labeling_guidelines.md. Every value is checked against the
# exported enums in schemas/json/ (ml/tests/test_taxonomy.py fails on drift).
#
# alternate_queues / alternate_actions are the ml copy of the §5.8 override allow-list. The spec
# names one example (sso_login_failure -> incident_response); the rest are conservative choices
# for label QA and MUST be reconciled with the backend routing allow-list when P1.5 freezes it.
version: label_rules.v1
taxonomy_version: "2026-09-v1"

critical_intents: # §5.1 "Critical?" (brief §9 recall metric)
  - security_report
  - service_outage
  - cancellation_request
  - billing_duplicate_charge
  - billing_payment_failure

forced_review_intents: # §5.1 "Forced review?" (S-03)
  - billing_duplicate_charge
  - billing_payment_failure
  - refund_request
  - cancellation_request
  - service_outage
  - security_report
  - privacy_legal_request

billing_intents: # the hard-set "legal threat inside billing" stratum and the matrix flag
  - billing_duplicate_charge
  - billing_payment_failure
  - refund_request

# Actions a forced-review primary intent must never get (they imply self-service resolution).
self_serve_actions:
  - answer_with_kb_article
  - share_pricing_page_reference
  - send_password_reset_guidance
  - no_action_spam
  - close_as_duplicate_ticket

# Labeling rule (docs/labeling_guidelines.md R11): these override the §5.8 default action.
conditional_actions:
  human_request: offer_human_contact # customer_requested_human = true
  insufficient_information: request_more_information # unless the primary is forced-review or listed below
insufficient_information_keeps_default:
  - sso_login_failure # its default action already asks for the SAML error details

routing: # §5.8 intent -> default queue & action, plus the ml allow-lists (see header)
  sso_login_failure:
    queue: technical_support_tier_2
    action: request_saml_error_details_and_check_known_incident
    alternate_queues: [incident_response]
    alternate_actions: [link_to_active_incident, route_to_tier_2]
  account_access_issue:
    queue: general_support_tier_1
    action: send_password_reset_guidance
    alternate_queues: [technical_support_tier_2]
    alternate_actions: [route_to_tier_2, answer_with_kb_article]
  billing_duplicate_charge:
    queue: billing_and_accounts
    action: escalate_to_billing_for_review
    alternate_queues: []
    alternate_actions: []
  billing_payment_failure:
    queue: billing_and_accounts
    action: escalate_to_billing_for_review
    alternate_queues: []
    alternate_actions: []
  refund_request:
    queue: billing_and_accounts
    action: escalate_to_billing_for_review
    alternate_queues: []
    alternate_actions: []
  cancellation_request:
    queue: customer_success_retention
    action: escalate_to_csm_retention
    alternate_queues: []
    alternate_actions: []
  plan_pricing_inquiry:
    queue: general_support_tier_1
    action: share_pricing_page_reference
    alternate_queues: [billing_and_accounts]
    alternate_actions: [answer_with_kb_article]
  service_outage:
    queue: incident_response
    action: check_known_incident_and_share_status
    alternate_queues: []
    alternate_actions: [link_to_active_incident, escalate_to_engineering]
  bug_report:
    queue: technical_support_tier_2
    action: collect_repro_steps_and_escalate_to_engineering
    alternate_queues: [incident_response]
    alternate_actions: [escalate_to_engineering, route_to_tier_2]
  how_to_question:
    queue: general_support_tier_1
    action: answer_with_kb_article
    alternate_queues: [technical_support_tier_2]
    alternate_actions: [route_to_tier_2]
  security_report:
    queue: security_and_privacy
    action: escalate_to_security
    alternate_queues: []
    alternate_actions: []
  privacy_legal_request:
    queue: security_and_privacy
    action: escalate_to_privacy_legal
    alternate_queues: []
    alternate_actions: []
  other_unclear:
    queue: general_support_tier_1
    action: request_more_information
    alternate_queues: []
    alternate_actions: [no_action_spam, close_as_duplicate_ticket]

# §5.3 definitions applied BEFORE policy floors (§9.2). base = typical ticket; severe = the
# matrix "severe" difficulty. plausible = labels outside this set raise an R9 warning.
priority:
  sso_login_failure: {base: high, severe: urgent, plausible: [urgent, high, normal]}
  account_access_issue: {base: normal, severe: high, plausible: [high, normal, low]}
  billing_duplicate_charge: {base: normal, severe: high, plausible: [high, normal]}
  billing_payment_failure: {base: high, severe: urgent, plausible: [urgent, high, normal]}
  refund_request: {base: normal, severe: high, plausible: [high, normal, low]}
  cancellation_request: {base: normal, severe: high, plausible: [high, normal, low]}
  plan_pricing_inquiry: {base: low, severe: normal, plausible: [normal, low]}
  service_outage: {base: urgent, severe: urgent, plausible: [urgent, high]}
  bug_report: {base: normal, severe: high, plausible: [urgent, high, normal, low]}
  how_to_question: {base: low, severe: normal, plausible: [normal, low]}
  security_report: {base: high, severe: urgent, plausible: [urgent, high]}
  privacy_legal_request: {base: normal, severe: high, plausible: [urgent, high, normal]}
  other_unclear: {base: low, severe: normal, plausible: [normal, low]}

# §5.5 single churn rule (A-06). Regexes are case-insensitive QA heuristics for rule R5; the
# backend's policy lexicons (backend/policy/lexicons/) are separate and authoritative at runtime.
churn:
  negative_sentiments: [frustrated, angry]
  medium_plans: [business, enterprise]
  high_cues: # explicit cancel intent, departure announcement, or ultimatum
    - '\bcancel(?:l?ing|l?ed|lation)?\b[^.!?\n]{0,40}\b(?:subscription|plan|contract|account|renewal|licen[cs]es?|seats?|workspace)\b'
    - '\b(?:subscription|plan|contract|account|workspace)\b[^.!?\n]{0,30}\bcancel'
    - '\b(?:not|won''t|will not|don''t|do not|aren''t|are not)\s+(?:be\s+)?renew(?:ing)?\b'
    - '\bterminat(?:e|ing|ion)\b[^.!?\n]{0,40}\b(?:contract|subscription|agreement|account|plan)\b'
    - '\bdowngrad(?:e|ing)\b[^.!?\n]{0,25}\bfree\b'
    - '\b(?:moving|switching|migrating|going|moved|switched|move|switch)\s+(?:over\s+|all\s+)?to\s+(?:another|a different|a new|a competing|some other)\s+(?:tool|vendor|provider|platform|product|solution|app)\b'
    - '\b(?:shut(?:ting)?\s+down|clos(?:e|ing)|end(?:ing)?)\s+(?:our|my|the)\s+(?:workspace|account|subscription|contract)\b'
    - '\blast chance\b'
    - '\b(?:we|i)(?:''ll| will| are going to|''re going to)\s+(?:leave|walk away|go elsewhere|switch|take our business)\b'
    - '\bif\s+(?:this|it|that)\s+(?:isn''t|is not|isnt|doesn''t|does not|can''t|cannot)\s+(?:get\s+)?(?:be\s+)?(?:fixed|resolved|refunded|sorted)\b'
    - '\bor\s+(?:else\s+)?(?:we''re|we are|we will be|i''m|i am)\s+(?:out|done|leaving|gone)\b'
    - '\bfinal\s+(?:warning|notice)\b'
  competitor_move: '\b(?:moving|switching|migrating|going|moved|switched|move|switch|migrate)\s+(?:over\s+|all\s+)?to\b'
  vague_cues: # medium: considering/evaluating alternatives without a decision
    - '\b(?:considering|evaluating|exploring|looking at|looking into|weighing|trialing|trialling|testing|comparing)\s+(?:other|alternative|different|competing|some other)\s+(?:tools|options|vendors|products|solutions|platforms|apps)\b'
    - '\b(?:considering|evaluating|exploring|weighing)\s+(?:our\s+)?alternatives\b'
    - '\blooking\s+(?:at|for|into)\s+alternatives\b'
    - '\b(?:shop|shopping)\s+around\b'
  repeated_contact_cues: # medium: repeated contacts
    - '\b(?:second|third|fourth|fifth|2nd|3rd|4th|5th)\s+(?:time|ticket|email|request|message)\b'
    - '\b(?:already|again)\s+(?:reported|contacted|written|emailed|asked|raised)\b'
    - '\b(?:reported|raised|asked about|contacted you about)\s+(?:this|it)\s+(?:twice|before|already|several times|multiple times)\b'
    - '\bstill\s+(?:no|not|waiting)\b[^.!?\n]{0,30}\b(?:response|reply|answer|fix|update)\b'

# §9.2 / S-02: direct and indirect requests for a person (QA heuristics for rule R6).
human_request:
  direct:
    - '\b(?:speak|talk|chat)\s+(?:to|with)\s+(?:a\s+|an\s+|your\s+)?(?:real\s+|actual\s+)?(?:human|person|agent|manager|supervisor|representative|someone|somebody)\b'
    - '\breal\s+(?:human|person)\b'
    - '\bhuman\s+(?:agent|being|support)\b'
    - '\b(?:escalate|transfer|hand)\s+(?:me|this|us)\s+(?:over\s+)?to\s+(?:a\s+)?(?:human|person|manager|supervisor)\b'
    - '\bnot\s+(?:a|another)\s+(?:bot|chatbot|robot)\b'
  indirect:
    - '\b(?:call|phone|ring)\s+(?:me|us)\b'
    - '\b(?:can|could|would|will)\s+(?:someone|somebody|anyone|one of you)\s+(?:\w+\s+){0,2}(?:call|phone|ring|contact|reach)\b'
    - '\bgive\s+(?:me|us)\s+a\s+(?:call|ring)\b'
    - '\b(?:have|get)\s+(?:someone|somebody)\s+(?:\w+\s+){0,2}(?:call|contact|reach out|get in touch)\b'
    - '\b(?:is there|do you have)\s+(?:a\s+)?(?:phone number|number i can call|someone i can talk)\b'
