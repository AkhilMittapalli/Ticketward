name: Bug report
description: Something does not work as specified.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Do not file it here; follow SECURITY.md (private reporting).
        Use synthetic data only: never paste real customer data, credentials or tokens.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [backend API, pipeline / policy, retrieval, ML / model, frontend, infra / compose, CI, docs]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the request_id from the problem+json response if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. docker compose up -d --build\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. 0.1.0 or a commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redacted structured logs only.
      render: shell
