# Security scanning (spec §12.8). Scanners run from digest-pinned official images or
# version-pinned PyPI tools; actions are pinned by commit SHA (resolved 2026-09-26).
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC: catches newly published advisories
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.9.6"
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  SEMGREP_IMAGE: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b

jobs:
  gitleaks:
    name: secrets / gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan git history
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            "$GITLEAKS_IMAGE" git --redact --no-banner --exit-code 1 /repo

  pip-audit:
    # Both uv projects: the backend lock and the ml lock (datagen, eval and, from P3, the
    # `train` extra; torch comes from the training platform and is never in the lock).
    name: deps / pip-audit (${{ matrix.project }} lock)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [backend, ml]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: ${{ matrix.project }}
      - name: Audit the locked dependency set (runtime + dev + all extras)
        run: |
          uv export --frozen --no-emit-project --all-extras --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --requirement "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip --strict

  bandit:
    name: sast / bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uvx --from "bandit[toml]==1.9.4" bandit -c backend/pyproject.toml -r backend/src scripts ml/src

  trivy:
    name: vulns / trivy fs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vulnerabilities and secrets (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs --scanners vuln,secret \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-dirs node_modules /src
      - name: Misconfiguration (report only until the P9 hardening review)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs --scanners misconfig \
            --severity HIGH,CRITICAL --exit-code 0 /src

  semgrep:
    name: sast / semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Registry rulesets + project rules (.semgrep.yml)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan \
            --config p/python --config p/owasp-top-ten --config .semgrep.yml \
            --metrics=off --error backend/src backend/alembic scripts ml/src
